<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#f0f4f8"/>
  <!-- Hexagonal close packing of circles — the Ffellonic base pattern -->
  <defs>
    <radialGradient id="sphere" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#dbe8f4"/>
      <stop offset="100%" stop-color="#1a3a5c" stop-opacity="0.85"/>
    </radialGradient>
  </defs>
  <!-- Row 1 (y=75, x starting at 75, step 130) -->
  <circle cx="75"  cy="75"  r="60" fill="url(#sphere)" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="205" cy="75"  r="60" fill="url(#sphere)" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="335" cy="75"  r="60" fill="url(#sphere)" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="465" cy="75"  r="60" fill="url(#sphere)" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="595" cy="75"  r="60" fill="url(#sphere)" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="725" cy="75"  r="60" fill="url(#sphere)" stroke="#1a3a5c" stroke-width="1.5"/>
  <!-- Row 2 (y=187.6, offset by 65) -->
  <circle cx="140" cy="188" r="60" fill="url(#sphere)" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="270" cy="188" r="60" fill="url(#sphere)" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="400" cy="188" r="60" fill="url(#sphere)" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="530" cy="188" r="60" fill="url(#sphere)" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="660" cy="188" r="60" fill="url(#sphere)" stroke="#1a3a5c" stroke-width="1.5"/>
  <!-- Row 3 -->
  <circle cx="75"  cy="301" r="60" fill="url(#sphere)" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="205" cy="301" r="60" fill="url(#sphere)" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="335" cy="301" r="60" fill="url(#sphere)" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="465" cy="301" r="60" fill="url(#sphere)" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="595" cy="301" r="60" fill="url(#sphere)" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="725" cy="301" r="60" fill="url(#sphere)" stroke="#1a3a5c" stroke-width="1.5"/>
  <!-- Row 4 -->
  <circle cx="140" cy="414" r="60" fill="url(#sphere)" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="270" cy="414" r="60" fill="url(#sphere)" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="400" cy="414" r="60" fill="url(#sphere)" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="530" cy="414" r="60" fill="url(#sphere)" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="660" cy="414" r="60" fill="url(#sphere)" stroke="#1a3a5c" stroke-width="1.5"/>
  <!-- Row 5 -->
  <circle cx="75"  cy="527" r="60" fill="url(#sphere)" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="205" cy="527" r="60" fill="url(#sphere)" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="335" cy="527" r="60" fill="url(#sphere)" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="465" cy="527" r="60" fill="url(#sphere)" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="595" cy="527" r="60" fill="url(#sphere)" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="725" cy="527" r="60" fill="url(#sphere)" stroke="#1a3a5c" stroke-width="1.5"/>
</svg>
