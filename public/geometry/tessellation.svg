<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#f0f4f8"/>
  <!-- Hexagonal tessellation pattern in navy/blue -->
  <defs>
    <pattern id="hex" x="0" y="0" width="90" height="78" patternUnits="userSpaceOnUse">
      <!-- Regular hexagon centered at 45,39 with radius ~36 -->
      <polygon points="45,3 81,22.5 81,57.5 45,77 9,57.5 9,22.5"
               fill="none" stroke="#1a3a5c" stroke-width="2.5" stroke-linejoin="round"/>
    </pattern>
    <pattern id="hex2" x="45" y="39" width="90" height="78" patternUnits="userSpaceOnUse">
      <polygon points="45,3 81,22.5 81,57.5 45,77 9,57.5 9,22.5"
               fill="none" stroke="#1a3a5c" stroke-width="2.5" stroke-linejoin="round"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#hex)"/>
  <rect width="800" height="600" fill="url(#hex2)"/>
  <!-- Accent: fill alternating hexagons with light blue -->
  <rect width="800" height="600" fill="none"/>
</svg>
