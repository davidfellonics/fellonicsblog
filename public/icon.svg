<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <style>
      circle { fill: none; stroke: #1a3a5c; stroke-width: 2.8; }
      .fill { fill: #1a3a5c; stroke: none; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="18" fill="#f0f4f8"/>
  <!-- 7-circle hexagonal packing (seed of life / Ffellonic base unit) -->
  <!-- Central circle -->
  <circle cx="50" cy="50" r="16"/>
  <!-- 6 surrounding circles at 60° intervals, touching centre -->
  <circle cx="82" cy="50"   r="16"/>
  <circle cx="66" cy="77.7" r="16"/>
  <circle cx="34" cy="77.7" r="16"/>
  <circle cx="18" cy="50"   r="16"/>
  <circle cx="34" cy="22.3" r="16"/>
  <circle cx="66" cy="22.3" r="16"/>
  <!-- Centre dot to anchor the composition -->
  <circle cx="50" cy="50" r="3.5" class="fill"/>
</svg>
